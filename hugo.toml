baseURL = 'https://whulames.github.io/space/'
defaultContentLanguage = 'zh'
languageCode = 'zh-cn'
title = "Lames's Space"
theme = 'PaperMod'
enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true

[params]
  defaultTheme = 'auto'
  defaultThemeAuto = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  mainSections = ['posts']
  disableSpecial1stPost = true
  disableAnchoredHeadings = false
  hideMeta = false
  hideSummary = false

[params.homeInfoParams]
  Title = "Lames's Space"
  Content = "技术笔记 · 折腾记录 · 一些想法"

[[params.socialIcons]]
  name = 'github'
  title = 'GitHub'
  url = 'https://github.com/whulames'

[params.assets]
  favicon = '/favicon.ico'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[permalinks]
  posts = '/posts/:slug/'

[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10
[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 20
[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 30
[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 40

[markup.highlight]
  style = 'monokai'
  lineNos = false
  noClasses = false
  guessSyntax = true
  tabWidth = 2

[markup.goldmark.renderer]
  unsafe = true
